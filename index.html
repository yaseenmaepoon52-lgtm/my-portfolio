<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <tile>My Portfolio</tile>
  <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .portfolio-card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .info-text {
            font-size: 1.1rem;
            margin: 0.8rem 0;
            color: #cbd5e1;
            text-align: left;
            background: #0f172a;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
        }

        .label {
            font-weight: bold;
            color: #38bdf8;
        }
    </style>
</head>
<body>
  <h1>สวัสดีครับ ยินดีต้อนรับสู่พอร์ตของนายเมธัส</h1>

  <p>ตำแหน่ง : นักศึกษาแผนกวิชาเทคโนโลยีสารสนเทศ</p>
